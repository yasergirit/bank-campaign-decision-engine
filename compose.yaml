name: bank-campaign-decision-engine
x-serving-image: &serving-image
  image: bank-campaign-decision-engine:local
  build:
    context: .
    dockerfile: Dockerfile
services:
  db:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank_campaign}
      POSTGRES_DB: ${POSTGRES_DB:-bank_campaign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  api:
    <<: *serving-image
    profiles: [serving]
    command:
      - .venv/bin/python
      - -m
      - uvicorn
      - bank_campaign.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./reports:/app/reports:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
  ui:
    <<: *serving-image
    profiles: [serving]
    command:
      - .venv/bin/python
      - -m
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8502
    environment:
      BANK_CAMPAIGN_API_URL: http://api:8000
      BANK_CAMPAIGN_PUBLIC_API_URL: http://127.0.0.1:${API_PORT:-18000}
    ports:
      - "127.0.0.1:${UI_PORT:-18502}:8502"
    volumes:
      - ./reports:/app/reports:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
volumes:
  postgres_data:
