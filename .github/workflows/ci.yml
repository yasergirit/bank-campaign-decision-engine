name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_USER: bank_campaign
      POSTGRES_DB: bank_campaign
      POSTGRES_PASSWORD: ci-isolated-test-password
      POSTGRES_PORT: "55432"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install locked dependencies
        run: |
          uv sync --locked
          uv pip install --python .venv/bin/python --require-hashes \
            -r requirements-ui.lock -r requirements-container.lock
          uv pip check --python .venv/bin/python

      - name: Lint, format and type-check
        run: |
          uv run --locked --inexact ruff check src app tests scripts
          uv run --locked --inexact ruff format --check src app tests scripts
          MYPYPATH=src uv run --locked --inexact mypy src app scripts

      - name: Run unit and surface tests
        run: uv run --locked --inexact pytest -q -m "not integration"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build serving image without runtime artifacts
        run: docker build --tag bank-campaign-decision-engine:ci .

      - name: Start PostgreSQL
        run: docker compose up --detach --wait db

      - name: Run isolated PostgreSQL tests
        env:
          BANK_CAMPAIGN_DB_TESTS: "1"
        run: uv run --locked --inexact pytest -q -m integration

      - name: Show PostgreSQL logs after failure
        if: failure()
        run: docker compose logs db

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes
